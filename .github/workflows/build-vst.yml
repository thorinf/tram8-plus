name: Build VST

on:
  pull_request:
    branches: [main]
    paths:
      - 'vst/**'
      - 'protocol/**'
      - 'VERSION'
      - '.github/workflows/build-vst.yml'

permissions:
  contents: read

concurrency:
  group: build-vst-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  vst:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S vst -B vst/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build vst/build --target tram8-bridge --config Release

      - name: Sign (ad-hoc)
        run: codesign --force --deep -s - vst/build/VST3/Release/tram8-bridge.vst3

      - name: Run tests
        run: make -C vst/tests test
