name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches VERSION file
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file_version" ]; then
            echo "Tag v$tag does not match VERSION file ($file_version)"
            exit 1
          fi
          echo "Tag and VERSION agree: $tag"

  firmware:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AVR toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-avr avr-libc

      - name: Build firmware
        run: make -C firmware

      - name: Run tests
        run: make -C firmware/tests test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Package firmware SysEx
        run: |
          uv run --frozen python tools/firmware-packager.py firmware/build/main.hex -v
          mv firmware/build/main_firmware.syx firmware/build/tram8-firmware.syx

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/build/tram8-firmware.syx

  vst:
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S vst -B vst/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build vst/build --config Release

      - name: Run tests
        run: make -C vst/tests test

      - name: Sign (ad-hoc)
        run: codesign --force --deep -s - vst/build/VST3/Release/tram8-bridge.vst3

      - name: Package VST
        run: |
          cd vst/build/VST3/Release
          zip -r tram8-bridge-macos.zip tram8-bridge.vst3

      - uses: actions/upload-artifact@v4
        with:
          name: vst
          path: vst/build/VST3/Release/tram8-bridge-macos.zip

  release:
    needs: [firmware, vst]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: vst
          path: artifacts

      - name: Extract changelog section
        id: changelog
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          section="$(awk -v ver="$version" '
            /^## / {
              if (in_section) exit
              heading = $0
              sub(/^##[[:space:]]+/, "", heading)
              split(heading, parts, /[[:space:]]+/)
              token = parts[1]
              sub(/^v/, "", token)
              sub(/^\[/, "", token)
              sub(/\]$/, "", token)
              if (token == ver) { in_section=1; next }
            }
            in_section { print }
          ' CHANGELOG.md)"
          if [ -z "$section" ]; then
            echo "No CHANGELOG.md entry for version $version"
            exit 1
          fi
          delimiter="CHANGELOG_EOF_${RANDOM}_${RANDOM}"
          {
            echo "body<<$delimiter"
            printf '%s\n' "$section"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: artifacts/*
